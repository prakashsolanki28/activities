server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # Screenshot uploads; nginx's 1 MB default would reject them.
  client_max_body_size 10m;

  # Security headers live in each location: nginx drops server-level add_header
  # wherever a location sets its own.

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    expires 30d;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }

  # SPA fallback lives only here, so missing /api and /uploads paths stay real 404s.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri $uri/ /index.html;
  }
}
