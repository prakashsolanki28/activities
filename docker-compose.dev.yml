# Local development: only Mongo, published on localhost for `pnpm dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: hrrl-activities-dev

services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db

volumes:
  mongo-dev-data:
